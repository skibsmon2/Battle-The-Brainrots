}

#top{position:fixed;top:0;left:0;right:0;height:64px;background:var(--brown);

.panel{position:fixed;top:70px;bottom:10px;width:340px;background:var(--blue2);

#fusion{right:10px} #index{left:10px}
.card{background:#3b6b88;padding:6px;border-radius:10px;margin:4px 0;cursor:pointer}
.lava{box-shadow:0 0 18px orange}
canvas{display:block;margin-top:64px}
.small{opacity:.8;font-size:12px}
</style>

/* ================= GAME ================= */
const LAVA_MULT=5.7, DESPAWN=40;
const c=document.getElementById('c'), ctx=c.getContext('2d');
function resize(){c.width=innerWidth;c.height=innerHeight-64}
resize(); addEventListener('resize',resize);
const player={x:300,y:200,s:4}, keys={};
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);

let money=0, enemies=[], allies=[];
const timers={Legendary:300,Mythic:900,Godly:1800,Secret:3600};
setInterval(()=>{
  for(const r in timers){timers[r]--; if(timers[r]<=0){spawn(r); timers[r]=(r==='Legendary'?300:r==='Mythic'?900:r==='Godly'?1800:3600);}}
},1000);

function toggle(id){const p=document.getElementById(id); p.style.display=p.style.display==='block'?'none':'block'; if(id==='fusion')renderFusion(); if(id==='index')renderIndex();}

function spawn(force){
  const pool=force?BRAINROTS.filter(b=>b.rarity===force):BRAINROTS;
  const b=pool[Math.floor(Math.random()*pool.length)];
  const lava=Math.random()<0.06;
  enemies.push({b,x:Math.random()*c.width,y:Math.random()*c.height,hp:120,t:DESPAWN,lava,earn:b.earn*(lava?LAVA_MULT:1)});
}

/* ===== Fusion ===== */
let fusionSlots=[];
function renderFusion(){
  fusion.innerHTML='<h3>Fusion</h3><div class="card">'+(fusionSlots.map(b=>b.name).join(' + ')||'Pick 3')+'</div>'+
  '<button onclick="fuse()">FUSE</button> <button onclick="fusionSlots=[];renderFusion()">Clear</button>'+
  allies.map((a,i)=>'<div class="card" onclick="add('+i+')">'+a.b.name+'</div>').join('');
}
function add(i){if(fusionSlots.length<3) fusionSlots.push(allies[i].b), renderFusion();}
function fuse(){
  const n=fusionSlots.map(b=>b.name);
  if(n.includes('🥳🔌 Party Socket') && n.includes('🎮👾 Party Arcadoo')){
    allies.push({b:BRAINROTS.find(b=>b.name==='👾🥳 Party Bros'), earn:600000000});
    alert('👾🥳 PARTY BROS CREATED');
  } else alert('Fusion failed');
  fusionSlots=[]; renderFusion();
}

/* ===== Index ===== */
function renderIndex(){
  index.innerHTML='<h3>Brainrot Index</h3>'+BRAINROTS.map(b=>'<div class="card">'+b.name+' ('+b.rarity+')</div>').join('');
}

/* ===== Loop ===== */
function loop(){
  ctx.clearRect(0,0,c.width,c.height);
  if(keys.w)player.y-=player.s; if(keys.s)player.y+=player.s;
  if(keys.a)player.x-=player.s; if(keys.d)player.x+=player.s;
  ctx.fillStyle='#8fd3ff'; ctx.beginPath(); ctx.arc(player.x,player.y,22,0,7); ctx.fill();

  enemies=enemies.filter(e=>{
    e.t-=1/60;
    ctx.fillStyle=e.lava?'orange':'#c9a36a';
    ctx.beginPath(); ctx.arc(e.x,e.y,46,0,7); ctx.fill();
    if(Math.hypot(e.x-player.x,e.y-player.y)<60){ e.hp--; if(e.hp<=0){allies.push(e); return false;} }
    return e.t>0;
  });

  allies.forEach(a=>money+=a.earn/200000);
  document.getElementById('money').textContent=Math.floor(money);
  document.getElementById('timers').textContent=`L:${timers.Legendary}s M:${timers.Mythic}s G:${timers.Godly}s S:${timers.Secret}s`;
  requestAnimationFrame(loop);
}
loop();
</script>
